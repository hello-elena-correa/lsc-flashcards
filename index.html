<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ele LSC Trainer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Let's practice LSC</h1>

      <!-- Pantalla de inicio -->
      <div id="startScreen" class="card start-card">
        <div class="start-icon">📚</div>

        <h2>¿Qué nivel quieres practicar?</h2>

        <p class="start-text">Selecciona una opción para comenzar</p>

        <div class="level-buttons">
          <button id="allLevelsBtn" class="level-button all-levels">
            <span class="button-icon">✨</span>
            <span>Todos los niveles</span>
          </button>

          <button id="level1Btn" class="level-button level-one">
            <span class="level-number">1</span>
            <span>Nivel 1</span>
          </button>

          <button id="level2Btn" class="level-button level-two">
            <span class="level-number">2</span>
            <span>Nivel 2</span>
          </button>

          <button id="level3Btn" class="level-button level-three">
            <span class="level-number">3</span>
            <span>Nivel 3</span>
          </button>
        </div>
      </div>

      <!-- Pantalla del juego -->
      <div id="gameScreen" class="game-screen">
        <div class="card">
          <p id="word">Carganding...</p>
          <p id="level" class="level"></p>
        </div>

        <div class="stats">
          <span>✔ Recordadas: <span id="correctCount">0</span></span>
          <span>✖ Falladas: <span id="wrongCount">0</span></span>
        </div>

        <div class="buttons">
          <button id="correctBtn">Obvi me acuerdo</button>
          <button id="wrongBtn">No me acuerdo &gt;.&lt;</button>
        </div>

        <div id="reviewSection" class="review-section">
          <button id="reviewToggle" class="review-toggle">
            🔖 Para repasar = <span id="reviewCount">0</span>
          </button>

          <div id="reviewList" class="review-list"></div>
        </div>
      </div>
    </div>

    <script src="js/algorithm.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
