<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ele LSC Trainer</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="container">
    <h1>Let's practice LSC</h1>

    <div class="card">
      <p id="word">Carganding...</p>
      <p id="level" class="level"></p>
    </div>

    <div class="stats">
      <span>✔ Recordadas: <span id="correctCount">0</span></span>
      <span>✖ Falladas: <span id="wrongCount">0</span></span>
    </div>

    <div class="buttons">
      <button id="correctBtn">Obvi me acuerdo</button>
      <button id="wrongBtn">No me acuerdo >.< </button>
    </div>
  </div>

  <script src="js/algorithm.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
